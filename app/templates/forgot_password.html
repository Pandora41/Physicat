{% extends "base.html" %}

{% block title %}パスワード再設定 - Physicat{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>パスワードを忘れた場合</h1>
    <p>登録済みのメールアドレスを入力してください。再設定用のリンクをお送りします。</p>
    <form method="POST" class="auth-form">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>

      <button type="submit" class="home-button">送信</button>
    </form>
    <p class="auth-footnote"><a href="{{ url_for('pages.login') }}">ログインへ戻る</a></p>
  </section>
{% endblock %}
